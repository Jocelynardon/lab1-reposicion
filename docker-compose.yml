x-airflow-common: &airflow-common
  build: .
  image: lab1-airflow:3.3.1
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/lab/dags
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: lab1-jwt-solo-desarrollo
    AIRFLOW__API__SECRET_KEY: lab1-api-solo-desarrollo
    AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: "False"
    PYTHONPATH: /opt/lab/src
    LAB_ROOT: /opt/lab
    GIT_COMMIT: ${GIT_COMMIT:-desconocido}
  volumes:
    - .:/opt/lab
    - ./airflow/logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: ["db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: ["api-server"]
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]

  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]

volumes:
  postgres-db:
